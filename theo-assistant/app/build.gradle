plugins {
    id "com.android.application"
}

android {
    namespace "com.theo.assistant"
    compileSdk 35

    defaultConfig {
        applicationId "com.theo.assistant"
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName "0.2"
    }

    signingConfigs {
        // Fixed family key so new builds install over old ones on every phone.
        theo {
            storeFile rootProject.file("keystore/theo.jks")
            storePassword "theoassistant"
            keyAlias "theo"
            keyPassword "theoassistant"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.theo
        }
        debug {
            signingConfig signingConfigs.theo
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
