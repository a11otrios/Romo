name: Build unsigned IPA

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        scheme: ["Romo", "Romo Control"]
    steps:
      - uses: actions/checkout@v4

      - name: Install pods
        run: pod install

      - name: Archive without signing
        run: |
          set -o pipefail
          xcodebuild archive \
            -workspace Romo.xcworkspace \
            -scheme "${{ matrix.scheme }}" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "build/app.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tail -200

      - name: Package IPA
        run: |
          mkdir -p build/Payload
          cp -R build/app.xcarchive/Products/Applications/*.app build/Payload/
          cd build && zip -qr "../${{ matrix.scheme }}.ipa" Payload

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.scheme }} IPA
          path: ${{ matrix.scheme }}.ipa
